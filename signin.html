<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign In</title>

    <link rel="stylesheet" href="signin.css" />
  </head>

  <body>
    <main class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <img src="img/logo-leadr.png" class="auth-logo" alt="" />

          <h1>Welcome Back</h1>
          <p>Sign in to your account and continue shopping</p>
        </div>

        <form id="signinForm">
          <div class="input-group">
            <label id="signColor" for="signinEmail"> Email Address </label>

            <input
              type="email"
              id="signinEmail"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />
          </div>

          <div class="input-group">
            <label id="signColor" for="signinPassword"> Password </label>

            <input
              type="password"
              id="signinPassword"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
          </div>

          <p class="form-message" id="signinMessage"></p>

          <button type="submit" class="auth-btn">Sign In</button>
        </form>

        <div class="auth-footer">
          <p>
            Don't have an account?
            <a href="signup.html">Create Account</a>
          </p>
        </div>
      </div>
    </main>

    <script src="signin.js"></script>
  </body>
</html>
