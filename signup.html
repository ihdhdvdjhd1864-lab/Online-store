<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Account</title>

    <link rel="stylesheet" href="signup.css" />
  </head>

  <body>
    <main class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <img src="img/logo-leadr.png" class="auth-logo" alt="" />
          <h1>Create Account</h1>
          <p>Create your account and start shopping</p>
        </div>

        <form id="signupForm">
          <div class="input-group">
            <label id="signColor" for="signupName">Full Name</label>
            <input
              type="text"
              id="signupName"
              placeholder="Enter your full name"
              autocomplete="name"
              required
            />
          </div>

          <div class="input-group">
            <label id="signColor" for="signupEmail">Email Address</label>
            <input
              type="email"
              id="signupEmail"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />
          </div>

          <div class="input-group">
            <label id="signColor" for="signupPassword">Password</label>
            <input
              type="password"
              id="signupPassword"
              placeholder="Enter your password"
              autocomplete="new-password"
              required
            />
          </div>

          <div class="input-group">
            <label id="signColor" for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm your password"
              autocomplete="new-password"
              required
            />
          </div>

          <p class="form-message" id="signupMessage"></p>

          <button type="submit" class="auth-btn"><a id="Create" href="index.html">Create Account</a></button>
        </form>

        <div class="auth-footer">
          <p>
            Already have an account?
            <a href="signin.html">Sign In</a>
          </p>
        </div>
      </div>
    </main>

    <script src="signup.js"></script>
  </body>
</html>
